# ==============================================================================
# AegisRansom-X: Multi-Service Docker Orchestration Blueprint
# (React SOC Frontend + FastAPI Backend + Native macOS Hardware Bridging)
# ==============================================================================
# ARCHITECTURAL NOTICE:
# - Apple Silicon Host Bridging:
#   Using extra_hosts: ['host.docker.internal:host-gateway'] allows containers to:
#   1. Communicate seamlessly with native macOS Ollama (Qwen-4B) on port 11434.
#   2. Bridge with the native darwin-arm64 FSEvents & POSIX SIGSTOP sentinel daemon.
# - Storage Isolation:
#   Enforces strict ./sandbox_targets/ volume mounting for safe attack simulation
#   and instant APFS rollback validation.
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # FastAPI Telemetry & Incident Arbiter Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aegis-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./sandbox_targets:/app/sandbox_targets"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen:4b
      - SANDBOX_PATH=/app/sandbox_targets
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # React + Vite Dark-Mode SOC Dashboard (Nginx Production Container)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production

  # ----------------------------------------------------------------------------
  # Optional Containerized Ollama Fallback Engine
  # (Only invoked if native macOS Apple Silicon Ollama daemon is absent)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: aegis-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    profiles:
      - full-offline

volumes:
  ollama_data:
    name: aegis_ollama_data
